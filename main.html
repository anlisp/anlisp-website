<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>your site</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <h1>Welcome</h1>

    <script>
      
(function () {
  const STORAGE_KEY = "site-theme";
  const root = document.documentElement;

  function applyTheme(theme) {
    if (theme === "modern") {
      root.setAttribute("data-theme", "modern");
    } else {
      root.removeAttribute("data-theme");
    }
    updateButtonLabel(theme);
  }

  function updateButtonLabel(theme) {
    const btn = document.getElementById("themeToggle");
    if (!btn) return;
    btn.textContent = theme === "modern" ? "✨ aero mode" : "◾ modern mode";
  }

  function currentTheme() {
    return root.getAttribute("data-theme") === "modern" ? "modern" : "aero";
  }

  function toggleTheme() {
    const next = currentTheme() === "modern" ? "aero" : "modern";
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  }

  document.addEventListener("DOMContentLoaded", function () {
    // apply saved (or default) theme immediately
    const saved = localStorage.getItem(STORAGE_KEY) || "aero";
    applyTheme(saved);

    // create the button if the page didn't already add one
    let btn = document.getElementById("themeToggle");
    if (!btn) {
      btn = document.createElement("button");
      btn.id = "themeToggle";
      document.body.appendChild(btn);
    }
    btn.addEventListener("click", toggleTheme);
  });
})();
    </script>
</body>
</html>
